name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Rules change over time, so rescan the unchanged code weekly too.
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyse C++
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          queries: security-and-quality

      # Built without the client so the scan does not need SFML. This still
      # covers the socket handling and packet parsing, which is the code that
      # actually reads untrusted input.
      - name: Build
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug -DBUILD_CLIENT=OFF
          cmake --build build -j"$(nproc)"

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
